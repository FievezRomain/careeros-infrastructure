name: careeros-dependencies-local

# Single-node local development only. Published ports are loopback-bound.
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: careeros_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:?Set PROFILE_DB_PASSWORD}
      JOB_DB_PASSWORD: ${JOB_DB_PASSWORD:?Set JOB_DB_PASSWORD}
      MATCHING_DB_PASSWORD: ${MATCHING_DB_PASSWORD:?Set MATCHING_DB_PASSWORD}
      RESUME_DB_PASSWORD: ${RESUME_DB_PASSWORD:?Set RESUME_DB_PASSWORD}
      ATS_DB_PASSWORD: ${ATS_DB_PASSWORD:?Set ATS_DB_PASSWORD}
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:?Set APPLICATION_DB_PASSWORD}
      COMMUNICATION_DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD:?Set COMMUNICATION_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Set ANALYTICS_DB_PASSWORD}
      AI_GATEWAY_DB_PASSWORD: ${AI_GATEWAY_DB_PASSWORD:?Set AI_GATEWAY_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-careeros-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    networks:
      - data

  rabbitmq:
    image: rabbitmq:4.4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: careeros
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    networks:
      - data

  object-storage:
    image: chrislusf/seaweedfs:4.53
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: careeros-resumes
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    networks:
      - data

volumes:
  postgres_data:
  rabbitmq_data:
  object_storage_data:

networks:
  data:
    name: careeros-data
    driver: bridge
