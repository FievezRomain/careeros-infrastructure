name: Security and configuration baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-config-test:
    runs-on: ubuntu-latest
    env:
      KEYCLOAK_DB_PASSWORD: test-only-placeholder
      KEYCLOAK_BOOTSTRAP_USERNAME: test-only-admin
      KEYCLOAK_BOOTSTRAP_PASSWORD: test-only-placeholder
      POSTGRES_ADMIN_PASSWORD: ci-only-placeholder
      IDENTITY_DB_PASSWORD: ci-only-placeholder
      PROFILE_DB_PASSWORD: ci-only-placeholder
      JOB_DB_PASSWORD: ci-only-placeholder
      MATCHING_DB_PASSWORD: ci-only-placeholder
      RESUME_DB_PASSWORD: ci-only-placeholder
      ATS_DB_PASSWORD: ci-only-placeholder
      APPLICATION_DB_PASSWORD: ci-only-placeholder
      COMMUNICATION_DB_PASSWORD: ci-only-placeholder
      ANALYTICS_DB_PASSWORD: ci-only-placeholder
      AI_GATEWAY_DB_PASSWORD: ci-only-placeholder
      RABBITMQ_USERNAME: ci-only-user
      RABBITMQ_PASSWORD: ci-only-placeholder
      S3_ACCESS_KEY: ci-only-access
      S3_SECRET_KEY: ci-only-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh -n scripts/init-local-keycloak.sh
      - run: sh -n infra/dependencies/init-databases.sh
      - run: node --check scripts/provision-local-keycloak.mjs
      - run: node --test tests/*.test.mjs
      - run: docker compose -f infra/keycloak/compose.local.yml config --quiet
      - run: docker compose -f infra/dependencies/compose.local.yml config --quiet
      - name: Start local dependencies
        run: docker compose -f infra/dependencies/compose.local.yml up -d --wait
      - name: Verify database ownership isolation
        run: |
          docker compose -f infra/dependencies/compose.local.yml exec -T \
            -e PGPASSWORD="$PROFILE_DB_PASSWORD" postgres \
            psql -h 127.0.0.1 -U profile_service -d careeros_profile -c 'SELECT 1'
          if docker compose -f infra/dependencies/compose.local.yml exec -T \
            -e PGPASSWORD="$PROFILE_DB_PASSWORD" postgres \
            psql -h 127.0.0.1 -U profile_service -d careeros_job -c 'SELECT 1'; then
            echo 'profile_service unexpectedly accessed careeros_job' >&2
            exit 1
          fi
      - name: Verify anonymous dependency access is denied
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:15672/api/overview)" = '401'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/)" = '403'
      - name: Stop local dependencies
        if: always()
        run: docker compose -f infra/dependencies/compose.local.yml down --volumes
